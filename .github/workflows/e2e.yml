name: E2E

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Backend env for CI
        run: |
          mkdir -p backend/data
          printf '%s\n' \
            'JWT_SECRET=ci_e2e_jwt_secret_not_for_production_use' \
            'DB_PATH=./data/cbt.sqlite' \
            'PORT=4000' \
            'NODE_ENV=test' \
            > backend/.env

      - name: Start servers and run Playwright
        run: |
          (cd backend && npm run dev) &
          (cd frontend && npm run dev) &
          npx wait-on -t 120000 -v http://127.0.0.1:4000/api/cbt/v1/health http://127.0.0.1:5173
          npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
